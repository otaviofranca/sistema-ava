<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVA - Sistema de Gestão</title>
    <script type="module" crossorigin src="./assets/index-xAQxVNtq.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-lZIYHKEl.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="root">
      <div id="diag-loading" style="font-family:Arial,sans-serif; padding:50px; color:#223027; max-width:640px; margin:0 auto;">
        <h2>Carregando o Sistema AVA…</h2>
        <p style="color:#5C6B60;">Se esta mensagem não sumir em alguns segundos, algo impediu o carregamento — a causa vai aparecer abaixo.</p>
        <div id="diag-error" style="display:none; margin-top:20px; padding:16px; background:#F5E4E0; border:1px solid #A64B3B; border-radius:8px; color:#7a3527; white-space:pre-wrap; font-family:monospace; font-size:12px;"></div>
      </div>
    </div>
    <script>
      function diagShow(msg) {
        var box = document.getElementById('diag-error');
        if (!box) return;
        box.style.display = 'block';
        box.textContent += (box.textContent ? '\n\n' : '') + msg;
      }
      window.addEventListener('error', function (e) {
        diagShow('Erro de JavaScript: ' + e.message + '\nArquivo: ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        diagShow('Erro de promessa (fetch/API): ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    </script>
  </body>
</html>
